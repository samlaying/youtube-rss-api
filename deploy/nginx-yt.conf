    # JSON API for the feed system
    location ^~ /yt/api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # RSS files. The token lives in the query string so ordinary feed readers can
    # subscribe without HTTP basic auth; keep it equal to YT_API_TOKEN.
    # Drop the `if` line if the feeds are meant to be public.
    location ^~ /yt/ {
        auth_basic off;
        if ($arg_token != "changeme") { return 403; }
        alias /opt/yt-feeds/feeds/;
        charset utf-8;
        default_type application/rss+xml;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }
